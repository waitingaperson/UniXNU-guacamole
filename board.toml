# OnePlus 7 Pro (guacamole, SM8150) device repository for UniXNU.
# The kernel is built in the ios-sweet tree and passed with --kernel; this
# board file drives the firmware, payload and boot-image steps.

[board]
name = "guacamole"
soc = "SM8150"
description = "OnePlus 7 Pro (GM1910)"
kit = "guacamole"

[firmware]
config = "guacamole"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
TARGET_DEVICE = "oneplus-guacamole"
FDT = "guacamole.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

[kernel]
# 4 KiB BCM2837 build with the iOS 16.7.16 source and UniXNU 4K patches.
defconfig = "guacamole_8796_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
roots = [
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.filesystems.hfs.kext",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOStorageFamily",
]

[payload]
volume = "GUACESP"
size_mib = 64
loader = "firmware"
title = "OnePlus 7 Pro - XNU"
dram_size = "0xc0000000"
panic_screen = false
timeout = 3
kernel_args = [
  "debug=0xc",
  "serial=3",
  "cpus=8",
  "keepsyms=1",
  "-enable_kprintf_spam",
  "-noprogress",
  "rd=ufsroot0",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "ufsrw=1",
  "rootrw=1",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  "sweetusb=0",
  "sweettouchdelay=20",
  "sweetfb_noconsole=1",
  "sweetfb_hz=30",
  "sweetgpu=3",
  "sweetlogdump=1",
]

[payload.adt]
tool = "scripts/make-guacamole-adt.py"
unique_chip_id = "required"
# Match the working shim window. 256 MiB leaves too little room in arm_vm_init's
# early I/O page-table reservation for the 0x2400000-byte framebuffer; 3 GiB
# also gives XNU the full kernel-managed RAM range.
owned_memory_size = "0xc0000000"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
# The ABL adds abl_base (the "Kernel" RAM region at 0x80000000) to these
# offsets. 0x1000000 would put a 32 MiB payload at 0x81000000-0x83000000,
# past the 0x82A00000 end of the reserved Kernel region into the DBI MMIO
# window, so the ABL does not load it. 0x800000 puts it at
# 0x80800000-0x82800000, after the ~5 MiB kernel/DTB and inside the region.
ramdisk_offset = 0x800000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
