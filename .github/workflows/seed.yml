name: guacamole data seed

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the DBRDISK1 Data seed
        run: bash scripts/build-data-seed-macos.sh build/data-seed
      - uses: actions/upload-artifact@v4
        with:
          name: data-seed
          path: |
            build/data-seed/data-seed.dbr
            build/data-seed/data-seed.json
      - name: Report
        run: cat build/data-seed/data-seed.json
